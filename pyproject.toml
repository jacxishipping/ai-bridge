[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge"
version = "0.3.0"
description = "Security-first, cross-platform AI-to-computer control platform over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.6.0,<2.0.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "psutil>=5.9",
  "httpx>=0.27",
  "cryptography>=42.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "Pillow>=10.0"]
desktop = ["Pillow>=10.0"]

[project.scripts]
ai-bridge = "ai_bridge.server:main"
ai-bridge-control = "ai_bridge.control.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E702"]  # semicolon one-liners in a few compact helpers; harmless
# BLE/S/PLW security-adjacent style rules are intentionally not enforced:
# broad exception handling is deliberate in the task runner / diagnostics
# (a failed probe must never crash the server), and subprocess calls
# are argument-array only (see security review in docs/).
